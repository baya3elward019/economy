<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دالة العرض ومرونة العرض السعرية</title><style>
:root{--bg:#071322;--fg:#eef7ff;--muted:#a9c0d2;--panel:#10283bcc;--accent:#52e4ca;--gold:#ffd184}body.light{--bg:#eef7fc;--fg:#102337;--muted:#466276;--panel:#ffffffdf;--accent:#087e8b;--gold:#a86400}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Tahoma,'Segoe UI',sans-serif;overflow:hidden;transition:.4s}body:before{content:'';position:fixed;inset:-30%;background:radial-gradient(circle at 20% 30%,#1aa5a528,transparent 32%),radial-gradient(circle at 75% 65%,#7653e633,transparent 35%);animation:drift 15s ease-in-out infinite alternate;pointer-events:none}@keyframes drift{to{transform:translate(8%, -7%) rotate(8deg)}}.slide{display:none;height:100dvh;padding:7vh 8vw 12vh;overflow:auto;position:relative;animation:appear .6s ease}.slide.active{display:flex;flex-direction:column;justify-content:center}@keyframes appear{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}h1{font-size:clamp(2rem,5vw,4.7rem);line-height:1.3;margin:.3em 0;color:var(--fg)}h2{font-size:clamp(1.6rem,3.2vw,3rem);margin:.2em 0 .7em}p,li{font-size:clamp(1.05rem,1.7vw,1.55rem);line-height:1.9}strong,.accent{color:var(--accent)}.eyebrow{color:var(--gold);font-weight:bold;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--panel);border:1px solid #8dcdd02c;border-radius:24px;padding:24px;box-shadow:0 15px 50px #0002;backdrop-filter:blur(14px)}.card h3{font-size:clamp(1.2rem,2vw,1.8rem);margin:0 0 10px}.card p{margin:.2em 0}.hero{text-align:center}.orb{width:140px;height:140px;margin:0 auto 25px;border-radius:35%;background:radial-gradient(circle at 30% 25%,#fff9,#38dbc9 25%,#0a617a 60%,#061d42);box-shadow:0 0 65px #25dcca77,inset -15px -15px 28px #061d4a;transform:rotate(-20deg);animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-17px) rotate(20deg)}}.names{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:1000px;margin:20px auto}.names span{background:var(--panel);border-radius:15px;padding:12px;font-size:1.12rem}.formula{direction:ltr;text-align:center;font:clamp(1.2rem,2.5vw,2.2rem) Georgia,serif;background:#0b9d9d22;border:1px solid #4bdcc455;border-radius:18px;padding:20px;margin:14px 0}.chart{width:100%;max-height:340px;background:#071e3033;border-radius:20px;padding:10px}.chart text{fill:var(--fg);font-size:15px}.chart line.axis{stroke:var(--fg);stroke-width:2}.chart path.curve{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}.tag{display:inline-block;border:1px solid var(--accent);border-radius:999px;padding:5px 16px;color:var(--accent)}.toolbar{position:fixed;top:15px;left:18px;display:flex;gap:8px;z-index:10}button{border:1px solid #77cfcf66;background:var(--panel);color:var(--fg);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:1rem}button:hover{border-color:var(--accent)}.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;z-index:20;background:var(--panel);padding:8px 14px;border-radius:18px;backdrop-filter:blur(15px)}.progress{position:fixed;bottom:0;right:0;height:4px;background:var(--accent);transition:.3s}.reveal{display:none}.reveal.show{display:block}.foot{color:var(--muted);font-size:1rem}.visual{font-size:6rem;text-align:center;filter:drop-shadow(0 12px 15px #0005)}.mini{font-size:1rem;color:var(--muted)}@media(max-width:720px){.slide{padding:12vh 5vw 14vh;justify-content:flex-start!important}.grid,.three,.names{grid-template-columns:1fr}.card{padding:15px}.orb{width:90px;height:90px}.visual{font-size:3rem}p,li{line-height:1.6}.names span{font-size:.95rem}.toolbar button{font-size:.85rem;padding:8px}}

/* Cinematic redesign */
:root{--bg:#050d1b;--panel:#0c1c30e8;--accent:#40e8d0;--gold:#ffbd64}
body{background:linear-gradient(125deg,#040914,#0a1c31 52%,#07101e);}
body:before{inset:-45%;background:radial-gradient(ellipse at 20% 25%,#146acb3b,transparent 34%),radial-gradient(ellipse at 85% 70%,#f29b3525,transparent 34%),radial-gradient(ellipse at 50% 48%,#18dfc51a,transparent 40%);animation:drift 12s ease-in-out infinite alternate}
body:after{content:'';position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:linear-gradient(#55c9f30c 1px,transparent 1px),linear-gradient(90deg,#55c9f30c 1px,transparent 1px);background-size:52px 52px;mask-image:linear-gradient(transparent 5%,black 100%);perspective:800px}
.light{background:linear-gradient(130deg,#f3faff,#d9edf7 55%,#fff3e6)}
.light:before{background:radial-gradient(circle at 25% 30%,#70bbf355,transparent 35%),radial-gradient(circle at 80% 70%,#f4bd6b55,transparent 30%)}
.card{background:linear-gradient(145deg,var(--panel),#123553c4);border:1px solid #72dce74a;box-shadow:0 20px 60px #0006,inset 0 1px #ffffff16;position:relative;overflow:hidden;transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-7px) perspective(700px) rotateX(2deg);box-shadow:0 26px 65px #0009,0 0 24px #28bfe522}
.light .card{background:linear-gradient(145deg,#ffffffed,#eaf6ffed);box-shadow:0 16px 40px #325b7b22}
.card:before{content:'';position:absolute;top:0;right:0;left:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--accent),transparent)}
.slide{isolation:isolate}.slide.active>.card,.slide.active>.grid>.card{animation:cardrise .75s both}
.slide.active>.grid>.card:nth-child(2){animation-delay:.12s}.slide.active>.grid>.card:nth-child(3){animation-delay:.24s}
@keyframes cardrise{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.chart{filter:drop-shadow(0 0 10px #28dddf40);background:linear-gradient(145deg,#03152a9e,#14324a5c);border:1px solid #3acfd044}
.chart path.curve{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 2.1s ease forwards;filter:drop-shadow(0 0 6px #49ffe2)}
@keyframes draw{to{stroke-dashoffset:0}}
.formula{background:linear-gradient(125deg,#0c426a77,#14382a66);box-shadow:inset 0 1px #ffffff1c,0 15px 30px #0003;border-color:#55d8f388}
.hero h1{background:linear-gradient(115deg,#fff,#b6efff 55%,#ffcb8c);background-clip:text;color:transparent;text-shadow:0 8px 35px #43cfff25}
.light .hero h1{background:linear-gradient(115deg,#16375a,#126e9c,#bd7423);background-clip:text}
.orb{width:190px;height:190px;border-radius:30%;background:radial-gradient(circle at 28% 22%,#fff9,#ffd08b 9%,#29a6d9 31%,#10385b 58%,#030e23 78%);box-shadow:0 0 90px #22c4e077,inset -25px -20px 45px #010d25,18px 30px 40px #0009;transform-style:preserve-3d}
.names span{border:1px solid #68d7f055;box-shadow:inset 0 1px #ffffff19,0 10px 25px #0003}
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.ambient i{position:absolute;display:block;width:4px;height:4px;border-radius:50%;background:#78d8ff;box-shadow:0 0 13px #39c9ff;animation:rise var(--duration) linear infinite;left:var(--x);bottom:-20px;opacity:0}
.ambient i:nth-child(3n){background:#ffc17c;box-shadow:0 0 15px #ffc17c}
@keyframes rise{10%{opacity:.7}80%{opacity:.45}100%{transform:translate3d(var(--dx),-110vh,0);opacity:0}}
.scene{position:fixed;left:2%;bottom:7%;width:26vw;height:34vh;opacity:.16;pointer-events:none;z-index:0;transform:perspective(650px) rotateY(-14deg);filter:drop-shadow(0 0 25px #3cc9ff)}
.scene .tower{position:absolute;bottom:0;width:20%;border:1px solid #51cfff;background:repeating-linear-gradient(0deg,#3fbaff55 0 4px,#0a3158 4px 17px);box-shadow:inset 5px 0 22px #39d3ff55,0 0 20px #2fbdff33;animation:skyline 5s ease-in-out infinite alternate}
.scene .tower:nth-child(1){left:4%;height:40%}.scene .tower:nth-child(2){left:27%;height:75%;animation-delay:-2s}.scene .tower:nth-child(3){left:51%;height:58%;animation-delay:-1s}.scene .tower:nth-child(4){left:75%;height:95%;animation-delay:-3s}
@keyframes skyline{to{filter:brightness(1.7);transform:translateY(-5px)}}
.slide>*{position:relative;z-index:1}.toolbar,.nav{box-shadow:0 8px 35px #0007;border:1px solid #6ccde63a}.nav{direction:rtl}
@media(max-width:720px){.scene{width:45vw;opacity:.08}.orb{width:110px;height:110px}.hero h1{font-size:2rem}}

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#09132c;--fg:#f9faff;--muted:#c4d5ec;--panel:#17274bdb;--accent:#61f6dc;--gold:#ffce72}
body{font-family:'Cairo',Tahoma,sans-serif;background:radial-gradient(ellipse at 10% 5%,#2c2471 0%,transparent 48%),radial-gradient(ellipse at 90% 95%,#044e72 0%,transparent 55%),var(--bg)}
body.light{--bg:#eaf4ff;--fg:#142246;--muted:#3c5278;--panel:#ffffffed;--accent:#007f9d;--gold:#b65b12}
body:before{background:radial-gradient(circle at 20% 20%,#ff4db544,transparent 25%),radial-gradient(circle at 75% 65%,#1ecbff55,transparent 34%),radial-gradient(circle at 55% 95%,#ffae4740,transparent 24%);animation:drift 10s ease-in-out infinite alternate}
.slide:after{content:'';position:absolute;z-index:0;left:5%;bottom:15%;width:170px;height:170px;border-radius:28%;background:conic-gradient(from 20deg,#fc63b9,#7049ff,#16d7e9,#ffd27d,#fc63b9);opacity:.13;filter:blur(12px);transform:rotate(-20deg);animation:float 6s ease-in-out infinite}
h1,h2,h3{font-family:'Cairo',Tahoma,sans-serif;font-weight:900;letter-spacing:-.5px}h1{background:linear-gradient(120deg,var(--fg),#ffcf8e,#ff77c8,#83d7ff);-webkit-background-clip:text;background-clip:text;color:transparent}h2{color:var(--fg);text-shadow:0 5px 25px #8c62ff55}
.card{border:1px solid #a7c6ff55;background:linear-gradient(145deg,#fff1,var(--panel) 55%,#8047ee18);box-shadow:0 20px 55px #0005,inset 0 1px #ffffff38;transform-style:preserve-3d;transition:transform .4s,box-shadow .4s,border-color .4s;position:relative;overflow:hidden}
.card:hover{transform:perspective(950px) rotateX(2deg) rotateY(-3deg) translateY(-8px);box-shadow:0 30px 65px #0007,0 0 35px #af68ff44;border-color:#ffd48eaa}
.card:before{content:'';position:absolute;top:-100%;left:-75%;width:60%;height:300%;transform:rotate(30deg);background:linear-gradient(90deg,transparent,#ffffff10,transparent);transition:left .8s}.card:hover:before{left:150%}
.card:nth-child(4n+1){border-top:3px solid #ff78b6}.card:nth-child(4n+2){border-top:3px solid #48dff4}.card:nth-child(4n+3){border-top:3px solid #ffd17a}.card:nth-child(4n){border-top:3px solid #8a8cff}
.formula{background:linear-gradient(130deg,#6a4fff2a,#12c5da26);border-color:#b0a5ff77;box-shadow:inset 0 0 25px #80e8ff16,0 10px 35px #0002}
.orb{width:155px;height:155px;border-radius:28%;background:radial-gradient(circle at 25% 20%,#fff,#ffb5db 12%,#ff67ac 30%,#8354ff 60%,#163579 85%);box-shadow:0 0 80px #a852ff88,inset -18px -20px 25px #141b65,15px 25px 40px #0006;transform:rotate(-20deg) perspective(500px) rotateX(15deg)}
.visual{font-size:5.8rem;transform:perspective(700px) rotateY(-12deg);animation:float 5s ease-in-out infinite;filter:drop-shadow(0 16px 4px #0004) drop-shadow(0 0 28px #ffb86e70)}
.chart{filter:drop-shadow(0 12px 18px #0003);border:1px solid #8dbeff3b;background:linear-gradient(135deg,#2e6ca321,#6b3fc625)}
.chart path.curve{stroke:#45f4d9;stroke-width:6;stroke-dasharray:600;stroke-dashoffset:600;animation:drawCurve 1.8s ease forwards;filter:drop-shadow(0 0 7px #46f4d9)}
@keyframes drawCurve{to{stroke-dashoffset:0}}
.names span{background:linear-gradient(120deg,#ff69b41b,#4bdcff1b);border:1px solid #ffffff40;box-shadow:0 8px 25px #0003;font-weight:700}
button{font-family:'Cairo',Tahoma,sans-serif;font-weight:800;background:linear-gradient(135deg,#5439a6aa,#127ca6aa);border:1px solid #a5bfff88;box-shadow:0 5px 18px #0003;transition:transform .2s}button:hover{transform:translateY(-3px)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.elasticity-formula{font-size:clamp(2rem,4vw,3.8rem);font-weight:900;color:var(--gold);border:2px solid #ffcf7290;padding:12px;margin:0 0 14px}.slide.active{overflow-y:auto}.slide .grid{align-items:stretch}.slide .card p{line-height:1.75}.slide .card{min-width:0}@media(max-width:720px){.elasticity-formula{font-size:2.2rem}}

/* Ensure decorative layers never block interactive controls */
.card::before,.card::after,.slide::after{pointer-events:none!important}
.reveal.show{display:block!important;visibility:visible!important;opacity:1!important}
button[data-reveal]{position:relative;z-index:5;pointer-events:auto}
</style></head><body><div class="toolbar"><button onclick="document.body.classList.toggle('light')">☀ / ☾</button><button onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">⛶ تكبير</button></div><div class="ambient" aria-hidden="true" id="ambient"></div><div class="scene" aria-hidden="true"><div class="tower"></div><div class="tower"></div><div class="tower"></div><div class="tower"></div></div><main id="deck"></main><div class="nav"><button onclick="move(-1)">→ السابق</button><span id="counter"></span><button onclick="move(1)">التالي ←</button></div><div class="progress" id="progress"></div><script>
document.getElementById('ambient').innerHTML=Array.from({length:42},(_,i)=>`<i style="--x:${(i*37)%100}%;--duration:${7+(i%9)}s;--dx:${(i%2?1:-1)*(30+i%70)}px;animation-delay:-${(i*7)%14}s"></i>`).join('');
const names=['ولاء عصام','الاء سراج الدين الطاهر','ردينة عادل شقاقة','رنيم أيمن ابوجناح','مريم محمد زكريا','سلسبيل محمود الزوبي'];
function chart(type){let path={elastic:'M 60 240 L 390 155',inelastic:'M 185 270 L 265 45',unit:'M 70 270 L 370 45',zero:'M 240 280 L 240 35',infinite:'M 50 150 L 410 150'}[type];return `<svg class="chart" viewBox="0 0 470 315" role="img" aria-label="رسم منحنى العرض"><line class="axis" x1="45" y1="280" x2="445" y2="280"/><line class="axis" x1="45" y1="280" x2="45" y2="20"/><text x="10" y="20">السعر P</text><text x="340" y="308">الكمية Q</text><path class="curve" d="${path}"/><circle cx="${type==='zero'?240: type==='infinite'?160:210}" cy="${type==='zero'?190:type==='infinite'?150: type==='inelastic'?200: type==='unit'?165:200}" r="6" fill="#ffd184"/></svg>`}
const slides=[
['<div class="hero"><div class="orb"></div><div class="eyebrow">عرض تقديمي جامعي • علم الاقتصاد</div><h1>من دالة العرض إلى<br><span class="accent">مرونة العرض السعرية</span></h1><p>فهم علاقة الأسعار بالكميات المعروضة وقياس درجة الاستجابة</p><div class="names">'+names.map(n=>`<span>${n}</span>`).join('')+'</div></div>'],
['<h2>خريطة العرض التقديمي</h2><div class="grid three">'+['المقدمة','دالة العرض والمتغيرات','الأنواع الخمسة ورسوماتها','القوانين والأمثلة الحسابية','التطبيقات والخاتمة'].map((x,i)=>`<div class="card"><h3><strong>0${i+1}</strong></h3><p>${x}</p></div>`).join('')+'</div>'],
['<h2>المقدمة</h2><div class="grid"><div class="card"><h3>مفهوم مرونة العرض السعرية</h3><p>تُعرف مرونة العرض السعرية (Price Elasticity of Supply) بأنها درجة استجابة أو حساسية الكمية المعروضة من سلعة ما للتغير في سعرها؛ أي أنها توضح مدى قدرة وسرعة المنتجين على تعديل حجم إنتاجهم عند تغير الأسعار.</p></div><div class="card"><h3>من اتجاه العلاقة إلى قياس الاستجابة</h3><p>وتكمن الأهمية الجوهرية لمرونة العرض في كونها تتجاوز التحليل العام لـ قانون العرض؛ فبينما يكتفي القانون بتحديد اتجاه العلاقة الطردية بين السعر والكمية المعروضة، تأتي المرونة لتقيس مقدار ودرجة هذه الاستجابة بدقة، موضحةً ما إذا كان التغير في المعروض سيكون كبيراً وسريعاً أم محدوداً وبطيئاً.</p></div></div><div class="card"><h3>أهمية دراسة مرونة العرض</h3><p>وتكتسب دراسة مرونة العرض أهمية بالغة في الاقتصاد؛ حيث تساعد الشركات على تخطيط الطاقة الإنتاجية وسياسات التسعير، وتتيح لصناع القرار تقييم أثر الضرائب و ومدى قدرة الأسواق على مواجهة تقلبات الطلب.</p></div>'],
['<h2>أولاً: دالة العرض (Supply Function)</h2><div class="grid"><div class="card"><h3>المفهوم الرياضي</h3><p>تُعرف الدالة رياضياً بأنها علاقة تأثير وتأثر بين متغيرات؛ حيث توجد عوامل مستقلة تسبّب التأثير، ومتغير تابع يتأثر بها وتتغير قيمته بناءً عليها.</p></div><div class="card"><h3>المفهوم الاقتصادي</h3><p>أما من الناحية الاقتصادية، فتُعبر دالة العرض رياضياً عن تأثّر الكمية المعروضة كـ (متغير تابع) بالعوامل المؤثرة فيها كـ (متغيرات مستقلة)، وفي مقدمتها سعر السلعة نفسه، بالإضافة إلى عوامل أخرى مثل أسعار عناصر الإنتاج، والمستوى التكنولوجي، وسياسات الضرائب والإعانات.</p></div></div>'],
['<h2>الصيغة الشاملة لدالة العرض</h2><div class="formula">Sₙ = f(Pₙ, P₁ … Pₙ₋₁, W₁ … Wₙ, T, R)</div><div class="grid"><div class="card"><h3>المتغير التابع</h3><p><strong>Sₙ:</strong> عرض السلعة؛ وهو المتغير الذي يتأثر.</p><p><strong>f:</strong> تعني «دالة في» أو «تتأثر بـ».</p></div><div class="card"><h3>المتغيرات المستقلة</h3><p><strong>Pₙ:</strong> سعر السلعة نفسها.</p><p><strong>P₁ … Pₙ₋₁:</strong> أسعار السلع الأخرى.</p><p><strong>W₁ … Wₙ:</strong> أسعار عناصر الإنتاج (التكاليف).</p><p><strong>T:</strong> الفن الإنتاجي (التكنولوجيا).</p><p><strong>R:</strong> الكفاءة وتفضيلات المنتجين.</p></div></div>'],
['<h2>العرض المرن</h2><div class="grid"><div class="card"><span class="tag">ESₚ > 1</span><p>تغير الكمية المعروضة بنسبة <strong>أكبر</strong> من تغير السعر.</p><p>مثلاً: السعر يرتفع 10%، والكمية ترتفع 30%؛ إذن المرونة = 3.</p><p class="mini">قد يظهر في سلع يمكن زيادة إنتاجها سريعاً.</p></div><div class="card"><div class="formula elasticity-formula">ESₚ &gt; 1</div>'+chart('elastic')+'</div></div>'],
['<h2>العرض غير المرن</h2><div class="grid"><div class="card"><span class="tag">0 < ESₚ < 1</span><p>تغير الكمية المعروضة بنسبة <strong>أقل</strong> من تغير السعر.</p><p>مثلاً: السعر يرتفع 20% والكمية ترتفع 5%؛ إذن المرونة = 0.25.</p><p class="mini">قد ينطبق على منتجات زراعية موسمية في الأجل القصير.</p></div><div class="card"><div class="formula elasticity-formula">0 &lt; ESₚ &lt; 1</div>'+chart('inelastic')+'</div></div>'],
['<h2>العرض متكافئ المرونة</h2><div class="grid"><div class="card"><span class="tag">ESₚ = 1</span><p>تتغير الكمية المعروضة <strong>بنفس نسبة</strong> تغير السعر تماماً.</p><p>مثلاً: زيادة السعر 15% تقابلها زيادة الكمية 15%.</p><p class="mini">هذا توصيف رياضي لحالة تساوي النسبتين، وليس خاصاً بنوع سلعة بعينه.</p></div><div class="card"><div class="formula elasticity-formula">ESₚ = 1</div>'+chart('unit')+'</div></div>'],
['<h2>العرض عديم المرونة</h2><div class="grid"><div class="card"><span class="tag">ESₚ = 0</span><p>الكمية المعروضة <strong>ثابتة</strong> لا تتغير مهما تغير السعر.</p><p>مثال: تحف أثرية نادرة لا يمكن زيادة عددها.</p></div><div class="card"><div class="formula elasticity-formula">ESₚ = 0</div>'+chart('zero')+'</div></div>'],
['<h2>العرض لا نهائي المرونة</h2><div class="grid"><div class="card"><span class="tag">ESₚ = ∞</span><p>استجابة غير محدودة للكمية عند سعر معين، ويظهر منحنى العرض <strong>أفقياً</strong>.</p><p>مثال توضيحي: نموذج نظري لعرض سلعة بسعر ثابت تماماً.</p><p class="mini">تنبيه: هذا نموذج مثالي، ولا يصح اعتباره وصفاً حرفياً للتحف الأثرية النادرة.</p></div><div class="card"><div class="formula elasticity-formula">ESₚ = ∞</div>'+chart('infinite')+'</div></div>'],
['<h2>4. القانون العام (النسبة المئوية)</h2><div class="formula">ESₚ = (%ΔQs) / (%ΔP)</div><div class="card"><h3>مثال محلول</h3><p>إذا ارتفع السعر بنسبة <strong>20%</strong> فزادت الكمية المعروضة بنسبة <strong>40%</strong>، فما المرونة؟</p><button type="button" data-reveal="true" onclick="reveal(this)">إظهار الحل خطوة بخطوة</button><div class="reveal"><div class="formula">ESₚ = 40% ÷ 20% = 2</div><p>بما أن 2 أكبر من 1، فإن <strong>العرض مرن</strong>.</p></div></div>'],
['<h2>قانون مرونة القوس (طريقة المنتصف)</h2><p>تُحسب بالاعتماد على متوسط السعر والكمية بين نقطتين.</p><div class="grid"><div class="card"><div class="formula">ΔQs = Q₂ − Q₁</div><div class="formula">ΔP = P₂ − P₁</div></div><div class="card"><div class="formula">P′ = (P₂ + P₁) / 2</div><div class="formula">Q′ = (Q₂ + Q₁) / 2</div></div></div><div class="formula">ESₚ = (ΔQs / Q′) ÷ (ΔP / P′)</div>'],
['<h2>مثال حسابي: طريقة المنتصف</h2><div class="grid"><div class="card"><h3>المعطيات</h3><p>P₁ = 10 ، Q₁ = 100</p><p>P₂ = 12 ، Q₂ = 160</p><p>ΔQs = 60 ، ΔP = 2</p><p>P′ = 11 ، Q′ = 130</p></div><div class="card"><h3>الحل</h3><button type="button" data-reveal="true" onclick="reveal(this)">إظهار خطوات الحل</button><div class="reveal"><div class="formula">ESₚ = (60/130) ÷ (2/11)</div><div class="formula">ESₚ ≈ 2.54</div><p>النتيجة: <strong>العرض مرن</strong> لأن 2.54 أكبر من 1.</p></div></div></div>'],
['<h2>الخاتمة</h2><div class="card"><p>في الختام، يتبين لنا أن دالة العرض توضح العلاقة بين السعر والكمية المعروضة، بينما تأتي مرونة العرض لتقيس درجة هذه الاستجابة بالأرقام، مما يساعد المنتجين على اتخاذ قرارات إنتاجية وتسعيرية دقيقة.</p><p>وتتلخص أهمية مرونة العرض في ثلاثة نقاط أساسية:</p></div><div class="grid three"><div class="card"><h3>الإنتاج</h3><p>معرفة مدى قدرة المصنع أو المنتج على زيادة الإنتاج عند ارتفاع الأسعار.</p></div><div class="card"><h3>التسعير</h3><p>فهم كيف ستتغير الكمية المعروضة في السوق عند تعديل السعر.</p></div><div class="card"><h3>التخطيط</h3><p>المساعدة في اتخاذ قرارات التوسع والاستثمار المستقبلي.</p></div></div><p class="foot"><strong>ملاحظة ختامية:</strong> مرونة العرض ليست ثابتة دائماً للسلعة نفسها، بل تتغير بحسب الفترة الزمنية وطبيعة السوق والقدرة على الإنتاج.</p>'],
['<div class="hero"><div class="orb"></div><h1>شكراً لحسن استماعكم</h1><p>هل لديكم أي أسئلة؟</p><div class="names">'+names.map(n=>`<span>${n}</span>`).join('')+'</div></div>']
];let index=0;document.getElementById('deck').innerHTML=slides.map((s,i)=>`<section class="slide ${i===0?'active':''}">${s[0]}</section>`).join('');function move(n){const els=document.querySelectorAll('.slide');els[index].classList.remove('active');index=Math.max(0,Math.min(els.length-1,index+n));els[index].classList.add('active');document.getElementById('counter').textContent=`${index+1} / ${els.length}`;document.getElementById('progress').style.width=`${(index+1)/els.length*100}%`;}function reveal(btn){btn.nextElementSibling.classList.toggle('show');btn.textContent=btn.nextElementSibling.classList.contains('show')?'إخفاء الحل':'إظهار خطوات الحل'}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='PageDown'||e.key===' ')move(1);if(e.key==='ArrowRight'||e.key==='PageUp')move(-1)});move(0);
</script></body></html>
